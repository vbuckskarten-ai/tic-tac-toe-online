<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101323">
  <title>Tic-Tac-Toe Online</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, Arial, sans-serif;
      color: #f5f6ff;
      background:
        radial-gradient(ellipse at top, #27305c, #101323 65%);
    }

    .app {
      width: 100%;
      max-width: 440px;
      padding: 25px;
      border: 1px solid #394166;
      border-radius: 25px;
      background: rgba(20, 25, 48, 0.96);
      box-shadow: 0 20px 60px #0005;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #aeb7d9;
    }

    .panel {
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #343d61;
      border-radius: 15px;
      background: #191f3b;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #c5cbea;
    }

    input, button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border-radius: 11px;
      font: inherit;
    }

    input {
      border: 1px solid #48547e;
      color: white;
      background: #10162c;
      text-transform: uppercase;
    }

    button {
      cursor: pointer;
      border: 0;
      color: white;
      background: #6257ee;
      font-weight: 700;
      transition: transform .12s, opacity .12s;
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .secondary {
      margin-top: 9px;
      color: #e2e5ff;
      background: #303958;
    }

    .status {
      margin: 18px 0;
      text-align: center;
      color: #dbe0ff;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .room {
      color: #a9a1ff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .players {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .player {
      padding: 13px 5px;
      text-align: center;
      border: 1px solid #343d61;
      border-radius: 13px;
      color: #bfc7e6;
      background: #191f3b;
    }

    .player strong {
      display: block;
      margin-bottom: 4px;
      font-size: 22px;
    }

    .active {
      border-color: #8b80ff;
      background: #29264f;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 17px;
    }

    .cell {
      aspect-ratio: 1;
      min-height: 0;
      padding: 0;
      border: 1px solid #3d4770;
      border-radius: 16px;
      background: #202746;
      font-size: clamp(42px, 14vw, 66px);
      font-weight: 800;
    }

    .cell.x { color: #78c9ff; }
    .cell.o { color: #ff91ca; }
    .cell:disabled { opacity: 1; cursor: default; }

    .message {
      min-height: 25px;
      margin: 10px 0 16px;
      text-align: center;
      color: #c5cbea;
      font-size: 14px;
    }

    .hidden { display: none !important; }

    .foot {
      margin-top: 18px;
      color: #8f99bd;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>⭕ Tic-Tac-Toe</h1>
    <p class="subtitle">Zwei Spieler. Ein Spiel. Online.</p>

    <section id="lobby">
      <div class="panel">
        <label for="roomInput">Spielcode deines Freundes</label>
        <input id="roomInput" maxlength="6"
               placeholder="z. B. AB12CD"
               autocomplete="off">
        <button id="joinBtn" style="margin-top:10px">
          Spiel beitreten
        </button>
      </div>

      <div style="text-align:center;margin:14px;color:#8f99bd">
        — oder —
      </div>

      <button id="createBtn">Neues Spiel erstellen</button>
    </section>

    <section id="game" class="hidden">
      <div class="panel" style="text-align:center">
        <label>DEIN SPIELCODE</label>
        <div id="roomCode" class="room">------</div>
        <button id="shareBtn" class="secondary">
          Einladungslink kopieren
        </button>
      </div>

      <div class="players">
        <div id="playerX" class="player">
          <strong style="color:#78c9ff">X</strong>
          <span id="nameX">Spieler X</span>
        </div>
        <div id="playerO" class="player">
          <strong style="color:#ff91ca">O</strong>
          <span id="nameO">Wartet auf Spieler</span>
        </div>
      </div>

      <div id="status" class="status" aria-live="polite">
        Verbinde ...
      </div>

      <div id="board" class="board"></div>

      <button id="resetBtn">Neue Runde</button>
      <button id="leaveBtn" class="secondary">Zurück zur Lobby</button>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
    <div class="foot">
      Online-Multiplayer über Firebase<br>
      Du brauchst eine Internetverbindung.
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // SCHRITT 2: Hier deine Firebase-Daten eintragen!
    
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAnm83n791L4QLyS5_p26-zINpTeE2QQrk",
  authDomain: "tictactoce-online.firebaseapp.com",
  databaseURL: "https://tictactoce-online-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tictactoce-online",
  storageBucket: "tictactoce-online.firebasestorage.app",
  messagingSenderId: "1012703491718",
  appId: "1:1012703491718:web:5f8b2b7c0eeeb18492c307",
  measurementId: "G-GFWKNER7EV"
};


    const configReady =
      firebaseConfig.apiKey !== "DEIN_API_KEY" &&
      firebaseConfig.databaseURL !== "DEINE_DATABASE_URL";

    const $ = id => document.getElementById(id);

    const lobby = $("lobby");
    const gameView = $("game");
    const message = $("message");
    const boardEl = $("board");

    let db = null;
    let user = null;
    let currentRoom = null;
    let myRole = null;
    let unsubscribe = null;
    let currentGame = null;
    let busy = false;

    const winningLines = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function setMessage(text) {
      message.textContent = text;
    }

    function showLobby() {
      if (unsubscribe) unsubscribe();
      unsubscribe = null;
      currentRoom = null;
      myRole = null;
      currentGame = null;
      busy = false;

      lobby.classList.remove("hidden");
      gameView.classList.add("hidden");
      setMessage("");
      history.replaceState(null, "", location.pathname);
    }

    function checkWinner(board) {
      for (const line of winningLines) {
        const [a,b,c] = line;
        if (board[a] !== "." &&
            board[a] === board[b] &&
            board[b] === board[c]) {
          return board[a];
        }
      }
      return null;
    }

    function randomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const bytes = new Uint8Array(6);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => chars[b % chars.length]).join("");
    }

    async function start() {
      if (!configReady) {
        setMessage("Bitte zuerst deine Firebase-Konfiguration im Code eintragen.");
        $("createBtn").disabled = true;
        $("joinBtn").disabled = true;
        return;
      }

      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        const credential = await firebase.auth().signInAnonymously();
        user = credential.user;

        setMessage("Verbunden! Du kannst ein Spiel erstellen.");

        const code = new URLSearchParams(location.search).get("room");
        if (code) {
          $("roomInput").value = code.toUpperCase();
          await joinRoom(code.toUpperCase());
        }
      } catch (error) {
        console.error(error);
        setMessage("Verbindung fehlgeschlagen: " + error.message);
      }
    }

    async function createRoom() {
      if (!user || busy) return;
      busy = true;
      $("createBtn").disabled = true;

      try {
        let code, roomRef, result;
        let found = false;

        for (let i = 0; i < 5; i++) {
          code = randomCode();
          roomRef = db.ref("games/" + code);

          result = await roomRef.transaction(old => {
            if (old === null) {
              return {
                x: user.uid,
                o: "",
                board: ".........",
                turn: "X",
                status: "waiting",
                createdAt: Date.now()
              };
            }
            return;
          }, undefined, false);

          if (result.committed) {
            found = true;
            break;
          }
        }

        if (!found) throw new Error("Kein freier Spielcode gefunden.");

        myRole = "X";
        openRoom(code);
      } catch (error) {
        console.error(error);
        setMessage("Spiel konnte nicht erstellt werden: " + error.message);
      } finally {
        busy = false;
        $("createBtn").disabled = false;
      }
    }

    async function joinRoom(rawCode) {
      if (!user || busy) return;
      const code = rawCode.trim().toUpperCase();

      if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
        setMessage("Bitte einen gültigen sechsstelligen Spielcode eingeben.");
        return;
      }

      busy = true;
      $("joinBtn").disabled = true;

      try {
        const roomRef = db.ref("games/" + code);

        const result = await roomRef.transaction(game => {
          if (!game) return;

          if (game.x === user.uid) return game;
          if (game.o === user.uid) return game;

          if (!game.o && game.x !== user.uid) {
            game.o = user.uid;
            game.status = "playing";
            return game;
          }

          return;
        }, undefined, false);

        if (!result.committed) {
          throw new Error("Spiel nicht gefunden oder bereits voll.");
        }

        const game = result.snapshot.val();

        if (game.x === user.uid) myRole = "X";
        else if (game.o === user.uid) myRole = "O";
        else throw new Error("Du konntest diesem Spiel nicht beitreten.");

        openRoom(code);
      } catch (error) {
        console.error(error);
        setMessage(error.message || "Beitritt fehlgeschlagen.");
      } finally {
        busy = false;
        $("joinBtn").disabled = false;
      }
    }

    function openRoom(code) {
      if (unsubscribe) unsubscribe();

      currentRoom = code;
      lobby.classList.add("hidden");
      gameView.classList.remove("hidden");
      $("roomCode").textContent = code;

      history.replaceState(null, "", "?room=" + code);

      unsubscribe = db.ref("games/" + code).on("value", snapshot => {
        currentGame = snapshot.val();

        if (!currentGame) {
          setMessage("Dieses Spiel existiert nicht mehr.");
          return;
        }

        render();
      }, error => {
        console.error(error);
        setMessage("Lesefehler: " + error.message);
      });
    }

    function render() {
      const g = currentGame;
      if (!g) return;

      const board = (g.board || ".........").split("");
      const winner = checkWinner(board);
      const draw = !winner && !board.includes(".");
      const isMyTurn = g.turn === myRole;

      $("nameX").textContent =
        g.x === user.uid ? "Du (X)" : "Spieler X";

      $("nameO").textContent = g.o
        ? (g.o === user.uid ? "Du (O)" : "Spieler O")
        : "Wartet auf Spieler";

      $("playerX").classList.toggle(
        "active", g.status === "playing" && g.turn === "X"
      );
      $("playerO").classList.toggle(
        "active", g.status === "playing" && g.turn === "O"
      );

      if (winner) {
        $("status").textContent =
          winner === myRole ? "🎉 Du hast gewonnen!" :
          "Dieses Mal hat dein Freund gewonnen.";
      } else if (draw) {
        $("status").textContent = "🤝 Unentschieden!";
      } else if (g.status === "waiting") {
        $("status").textContent = "Warte auf deinen Freund ...";
      } else {
        $("status").textContent = isMyTurn
          ? "Du bist dran!"
          : "Dein Freund ist am Zug.";
      }

      boardEl.replaceChildren();

      board.forEach((value, index) => {
        const button = document.createElement("button");
        button.className = "cell " +
          (value === "X" ? "x" : value === "O" ? "o" : "");
        button.textContent = value === "." ? "" : value;
        button.setAttribute("aria-label",
          "Feld " + (index + 1) + (value === "." ? ", leer" : ", " + value));

        button.disabled =
          g.status !== "playing" ||
          !isMyTurn ||
          value !== "." ||
          !!winner ||
          draw ||
          busy;

        button.addEventListener("click", () => playMove(index));
        boardEl.appendChild(button);
      });

      $("resetBtn").textContent = "Neue Runde";
    }

    async function playMove(index) {
      if (!currentRoom || !user || busy) return;
      busy = true;
      render();

      try {
        const roomRef = db.ref("games/" + currentRoom);

        const result = await roomRef.transaction(g => {
          if (!g || g.status !== "playing") return;
          if (g.turn !== myRole) return;
          if (g[myRole.toLowerCase()] !== user.uid) return;

          const board = (g.board || ".........").split("");
          if (board[index] !== ".") return;
          if (checkWinner(board)) return;

          board[index] = myRole;
          g.board = board.join("");

          const winner = checkWinner(board);
          const draw = !winner && !board.includes(".");

          if (winner || draw) {
            g.status = "finished";
          } else {
            g.turn = myRole === "X" ? "O" : "X";
          }

          return g;
        }, undefined, false);

        if (!result.committed) {
          setMessage("Zug nicht möglich. Bitte aktualisiere das Spiel.");
        }
      } catch (error) {
        console.error(error);
        setMessage("Spielzug fehlgeschlagen: " + error.message);
      } finally {
        busy = false;
        render();
      }
    }

    async function resetGame() {
      if (!currentRoom || !user || busy) return;
      busy = true;
      render();

      try {
        const roomRef = db.ref("games/" + currentRoom);

        const result = await roomRef.transaction(g => {
          if (!g) return;
          if (g.x !== user.uid && g.o !== user.uid) return;

          g.board = ".........";
          g.turn = "X";
          g.status = g.o ? "playing" : "waiting";
          return g;
        }, undefined, false);

        if (!result.committed) {
          setMessage("Neustart fehlgeschlagen.");
        }
      } catch (error) {
        console.error(error);
        setMessage("Neustart fehlgeschlagen: " + error.message);
      } finally {
        busy = false;
        render();
      }
    }

    async function shareRoom() {
      const link = location.origin + location.pathname +
        "?room=" + currentRoom;

      try {
        await navigator.clipboard.writeText(link);
        setMessage("Einladungslink kopiert! Sende ihn deinem Freund.");
      } catch {
        window.prompt("Kopiere diesen Einladungslink:", link);
      }
    }

    $("createBtn").addEventListener("click", createRoom);
    $("joinBtn").addEventListener("click", () =>
      joinRoom($("roomInput").value)
    );
    $("roomInput").addEventListener("keydown", event => {
      if (event.key === "Enter") joinRoom($("roomInput").value);
    });
    $("shareBtn").addEventListener("click", shareRoom);
    $("resetBtn").addEventListener("click", resetGame);
    $("leaveBtn").addEventListener("click", showLobby);

    start();
  </script>
</body>
</html>
